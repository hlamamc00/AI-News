# Site-wide settings. Environment variables override a few keys:
#   NEWSBOT_BASE_URL       -> site.base_url
#   NEWSBOT_WRITER         -> writer.mode   (auto | claude | template)
#   NEWSBOT_MAX_ARTICLES   -> articles.max_per_run
#   ANTHROPIC_API_KEY      -> enables the Claude writer (never put the key here)

site:
  title: AI News Desk
  tagline: Automated worldwide news, rewritten from 150+ sources every few hours.
  # Public URL of the deployed site, used for the RSS feed, sitemap and
  # canonical links. Leave empty for local previews (links then start at "/").
  # The publish workflow sets NEWSBOT_BASE_URL from GitHub Pages automatically.
  base_url: ""
  language: en
  # Shown in the footer and on the About page. Keep it honest: the site is
  # machine-written.
  byline: AI News Desk newsroom (automated)

fetch:
  # Ignore feed items older than this.
  max_age_hours: 36
  # Maximum items taken from any single feed per run.
  per_feed_limit: 40
  timeout_seconds: 20
  workers: 16
  user_agent: "Mozilla/5.0 (compatible; AINewsDeskBot/1.0; +https://github.com/hlamamc00/AI-News)"
  # Wikimedia and other public APIs ask for a descriptive agent with a contact URL
  # and throttle browser-style ones. Put your own repository or site here.
  api_user_agent: "AINewsDeskBot/1.0 (+https://github.com/hlamamc00/AI-News)"

extract:
  # Fetch the full text of the lead source articles (respecting robots.txt)
  # so the writer has more than the RSS blurb to work from.
  enabled: true
  # How many source URLs to fetch per story.
  per_story: 2
  # Characters of extracted text kept per source.
  max_chars: 3500
  timeout_seconds: 20
  workers: 8

articles:
  # Upper bound on new articles per run.
  max_per_run: 24
  # Guarantee at least this many stories per region when candidates exist.
  per_region_min: 2
  # Guarantee at least this many stories per topical category (business,
  # technology, science, health, environment, sport, culture) when available.
  per_topic_min: 1
  # No topical category (sport, culture, technology, ...) may take more than
  # this share of a run. General "world" news is not capped.
  max_category_share: 0.25
  # Skip a story if we published something with very similar keywords in the
  # last N hours (prevents re-writing the same story every run).
  dedupe_window_hours: 48
  # Minimum similarity (0-1) that counts as "already covered".
  dedupe_threshold: 0.5

cluster:
  # Minimum combined similarity for two items to be treated as one story.
  threshold: 0.45

writer:
  # auto / claude -> articles are written by Claude; the run stops with a clear
  #                  error if ANTHROPIC_API_KEY is missing. A story Claude cannot
  #                  write (refusal, too close to the sources) is skipped, never
  #                  published as a copy of the publishers' text.
  # template      -> local PREVIEW only: quotes publisher summaries so you can see
  #                  the layout without an API key. Output goes to content/preview/
  #                  (git-ignored) and is never committed or deployed.
  mode: auto
  model: claude-opus-5-5
  # low | medium | high | xhigh | max
  effort: medium
  max_tokens: 16000
  # Parallel article generations.
  workers: 3
  # Sources passed to the writer per story.
  max_sources: 6
  # Reject a draft when more than this share of its eight-word phrases appear
  # word for word in the sources (the writer gets one second try first).
  max_verbatim_ratio: 0.10

build:
  output_dir: site
  # Items on the home page, per region page, per topic page, and in the feed.
  home_items: 30
  section_items: 60
  feed_items: 50

images:
  # Illustrations come from Wikimedia Commons only, and only files under
  # CC0, public-domain, CC BY or CC BY-SA licences. They are captioned as
  # illustrative and credited on the article page and on /credits/.
  # Publisher photos from the RSS feeds are never used.
  enabled: true
  min_width: 1000
  thumb_width: 960
  timeout_seconds: 20
  # Pause between Commons lookups, to stay well inside their rate limits.
  delay_seconds: 1.0

newsletter:
  enabled: true
  # A daily briefing covers the 24 hours before this UTC hour and is published
  # once that hour has passed (the first workflow run after it).
  edition_hour_utc: 6
  # Skip a day with fewer articles than this.
  min_articles: 6
  top_stories: 5
  per_region: 3
  archive_items: 60
  # Email signup. Paste the form action URL from your email provider (Buttondown,
  # Mailchimp, MailerLite, Brevo, Kit ...). Leave empty to hide the signup form.
  # In GitHub Actions you can set the repository variable NEWSBOT_SUBSCRIBE_URL
  # instead. The briefing is also published as /newsletter/feed.xml so that a
  # provider's "RSS to email" campaign can send it automatically.
  subscribe_url: ""
  subscribe_email_field: email
  subscribe_method: post
  # Extra hidden inputs some providers require, e.g. {embed: "1"}.
  subscribe_hidden_fields: {}
