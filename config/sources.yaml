# Feed catalogue for the newsroom pipeline.
#
# Every entry is an RSS/Atom feed. "region" and "category" are the defaults
# applied to items from that feed; the article writer may re-classify a story
# once it has read the source material (for example a BBC World item about
# Nigeria becomes region: africa).
#
# Allowed regions:    global, africa, americas, asia, europe, middle-east, oceania
# Allowed categories: world, politics, business, technology, science, health,
#                     environment, sport, culture
#
# Add, remove or reorder feeds freely. Run `python -m newsbot sources --check`
# to verify every feed still parses.

